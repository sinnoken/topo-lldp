<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" id="metaDesc" content="">
<title>景深計算器</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#f7f9fc; --card:#fff; --sunken:#eef2f8;
  --fg:#0f1929; --muted:#5a6b84; --faint:#8b9ab0;
  --line:#e1e8f2; --line2:#c9d5e5;
  --brand:#2563eb; --brand-soft:#2563eb14;
  --ok:#15803d; --ok-bg:#dcfce7; --ok-line:#22c55e;
  --no:#be123c; --no-bg:#ffe4e6; --no-line:#f43f5e;
  --warn:#a16207;
  --r1:10px; --r2:16px; --r3:24px;
  --sh:0 1px 3px #0f172a0f,0 10px 30px #0f172a0d;
  --mono:ui-monospace,SFMono-Regular,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0a1120; --card:#141d2e; --sunken:#0f1728;
  --fg:#eaf1fc; --muted:#9db0c9; --faint:#6d809b;
  --line:#243149; --line2:#33435f;
  --brand:#60a5fa; --brand-soft:#60a5fa1a;
  --ok:#4ade80; --ok-bg:#052e16; --ok-line:#22c55e;
  --no:#fb7185; --no-bg:#3f0d1a; --no-line:#f43f5e;
  --warn:#fbbf24;
  --sh:0 1px 3px #0008,0 12px 36px #0005;
}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC","Noto Sans JP","PingFang TC",sans-serif;
  line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2{margin:0;line-height:1.25;text-wrap:balance}
p{margin:0}
:where(button,select,input):focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.wrap{max-width:820px;margin-inline:auto;padding:clamp(16px,4vw,36px) clamp(16px,4vw,28px)}

.localebar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:14px}
.localebar select{width:auto;padding:6px 10px;font-size:.82rem;border-radius:999px;
  background:var(--card);border:1px solid var(--line2);color:var(--muted);cursor:pointer}

.step{background:var(--card);border:1px solid var(--line);border-radius:var(--r3);
  padding:clamp(18px,3vw,26px);box-shadow:var(--sh);margin-bottom:16px}
.step__head{display:flex;align-items:center;gap:11px;margin-bottom:6px}
.step__num{flex:none;width:27px;height:27px;border-radius:50%;background:var(--brand);
  color:#fff;font-size:.86rem;font-weight:800;display:grid;place-items:center}
.step__title{font-size:1.08rem;font-weight:750}
.step__sub{color:var(--muted);font-size:.89rem;margin:0 0 16px 38px}
@media (max-width:520px){.step__sub{margin-inline-start:0}}

.masthead{text-align:center;padding-bottom:6px}
.masthead h1{font-size:clamp(1.45rem,4.2vw,2rem);font-weight:800;letter-spacing:-.02em}
.masthead p{color:var(--muted);margin-top:8px;font-size:.95rem}

.verdict{border-radius:var(--r3);padding:clamp(18px,3vw,26px);margin-bottom:16px;
  border:2px solid var(--ok-line);background:var(--ok-bg);box-shadow:var(--sh)}
.verdict[data-ok=false]{border-color:var(--no-line);background:var(--no-bg)}
.verdict__flag{display:flex;align-items:center;gap:9px;font-weight:800;font-size:1.1rem;color:var(--ok)}
.verdict[data-ok=false] .verdict__flag{color:var(--no)}
.verdict__icon{font-size:1.3rem}
.verdict__msg{margin-top:7px;font-size:.93rem;opacity:.85}
.answer{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
@media (max-width:460px){.answer{grid-template-columns:1fr}}
.answer__cell{background:var(--card);border-radius:var(--r2);padding:14px 16px;border:1px solid var(--line)}
.answer__cell--wide{grid-column:1/-1}
.answer__cell--wide .answer__v{font-size:1.25rem}
.answer__k{display:block;font-size:.8rem;color:var(--muted);font-weight:650}
.answer__v{display:block;font-family:var(--mono);font-size:1.7rem;font-weight:800;
  font-variant-numeric:tabular-nums;margin-top:2px;letter-spacing:-.02em}
.answer__note{display:block;font-size:.76rem;color:var(--faint);margin-top:1px}
.exp-warn{color:var(--warn);font-weight:650}

.ruler{position:relative;height:116px;border-radius:var(--r2);background:var(--sunken);
  border:1px solid var(--line);overflow:hidden;margin-top:4px}
.ruler__dof{position:absolute;top:0;bottom:22px;background:#22c55e2e;
  border-inline:2px solid var(--ok-line);transition:left .2s,width .2s}
.ruler__target{position:absolute;top:22px;bottom:44px;border:2px dashed var(--brand);
  border-radius:7px;transition:left .2s,width .2s}
.ruler__tlabel{position:absolute;top:2px;font-size:.72rem;font-weight:700;color:var(--brand);
  transform:translateX(-50%);white-space:nowrap;transition:left .2s}
.ruler__focus{position:absolute;top:0;bottom:22px;width:2px;background:var(--fg);transition:left .2s}
.ruler__focus::after{content:"▼";position:absolute;top:-3px;left:50%;transform:translateX(-50%);
  font-size:.62rem;color:var(--fg)}
.ruler__ticks{position:absolute;inset-inline:0;bottom:0;height:22px;display:flex;
  justify-content:space-between;align-items:center;padding-inline:6px;
  border-top:1px solid var(--line);font-family:var(--mono);font-size:.68rem;color:var(--faint)}
.key{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:.8rem;color:var(--muted)}
.key i{display:inline-block;width:15px;height:11px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}

.fields{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f__label{font-size:.88rem;font-weight:700}
.f__hint{font-size:.77rem;color:var(--faint);min-height:1.1em}
.f__hint--warn{color:var(--warn);font-weight:650}
select,input[type=number]{width:100%;min-width:0;padding:10px 11px;font:inherit;font-size:.95rem;
  color:var(--fg);background:var(--sunken);border:1px solid var(--line2);border-radius:var(--r1)}
input[type=number]{font-family:var(--mono);font-variant-numeric:tabular-nums}
input[aria-invalid=true]{border-color:var(--no)}
.pair{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:7px}
.pair span{color:var(--faint);font-size:.85rem}

.slide{display:flex;flex-direction:column;gap:7px}
.slide__top{display:flex;justify-content:space-between;align-items:baseline}
.slide__val{font-family:var(--mono);font-weight:800;font-size:1.05rem;color:var(--brand)}
input[type=range]{width:100%;accent-color:var(--brand);height:24px}
.slide__ends{display:flex;justify-content:space-between;font-size:.72rem;color:var(--faint);font-family:var(--mono)}

.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font:inherit;font-size:.85rem;font-weight:700;cursor:pointer;padding:7px 13px;
  border-radius:999px;border:1px solid var(--line2);background:var(--sunken);color:var(--muted);transition:.14s}
.chip:hover{border-color:var(--brand);color:var(--fg)}
.chip[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}

.acts{display:flex;flex-wrap:wrap;gap:9px;margin-top:16px}
.btn{font:inherit;font-size:.88rem;font-weight:700;cursor:pointer;padding:10px 16px;
  border-radius:var(--r1);border:1px solid transparent;transition:.14s}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn--go{background:var(--brand);color:#fff}
.btn--sub{background:transparent;color:var(--muted);border-color:var(--line2)}

details{margin-top:14px;border:1px solid var(--line);border-radius:var(--r2);
  background:var(--sunken);overflow:hidden}
summary{cursor:pointer;padding:12px 16px;font-weight:700;font-size:.9rem;list-style:none;
  display:flex;justify-content:space-between;align-items:center;gap:10px}
summary::-webkit-details-marker{display:none}
summary::after{content:"▾";color:var(--faint);transition:transform .2s}
details[open] summary::after{transform:rotate(180deg)}
.details__body{padding:0 16px 16px}

.tscroll{overflow-x:auto;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:.88rem;min-width:420px}
th,td{padding:8px 9px;text-align:end;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th{color:var(--muted);font-size:.78rem;font-weight:650;white-space:nowrap}
th:first-child,td:first-child{text-align:start;font-family:var(--mono);font-weight:700}
tbody tr[data-now=true]{background:var(--brand-soft)}
.good{color:var(--ok);font-weight:700}
.bad{color:var(--no)}
.mini{color:var(--muted);font-size:.85rem;margin-top:12px}
.mini dt{font-weight:700;color:var(--fg);margin-top:9px}
.mini dd{margin:1px 0 0;margin-inline-start:0}
.foot{text-align:center;color:var(--faint);font-size:.8rem;padding-bottom:32px}
@media print{.acts,.chips,.localebar{display:none}}
</style>
</head>
<body>
<div class="wrap">

<div class="localebar">
  <select id="lang" aria-label="Language"></select>
  <select id="unit" aria-label="Units"></select>
</div>

<header class="masthead">
  <h1 data-i18n="app.title"></h1>
  <p data-i18n="app.tagline"></p>
</header>

<section class="verdict" id="verdict" aria-live="polite">
  <div class="verdict__flag"><span class="verdict__icon" id="vIcon">✓</span><span id="vFlag"></span></div>
  <p class="verdict__msg" id="vMsg"></p>
  <div class="answer">
    <div class="answer__cell">
      <span class="answer__k" data-i18n="answer.focus"></span>
      <span class="answer__v" id="aFocus">—</span>
      <span class="answer__note" id="aFocusNote"></span>
    </div>
    <div class="answer__cell">
      <span class="answer__k" data-i18n="answer.stop"></span>
      <span class="answer__v" id="aStop">—</span>
      <span class="answer__note" id="aStopNote"></span>
    </div>
    <div class="answer__cell answer__cell--wide">
      <span class="answer__k" data-i18n="answer.exposure"></span>
      <span class="answer__v" id="aExp">—</span>
      <span class="answer__note" id="aExpNote"></span>
    </div>
  </div>
  <div class="acts">
    <button class="btn btn--go"  type="button" id="btnApply" data-i18n="btn.apply"></button>
    <button class="btn btn--sub" type="button" id="btnLink"  data-i18n="btn.link"></button>
    <button class="btn btn--sub" type="button" id="btnReset" data-i18n="btn.reset"></button>
  </div>
</section>

<section class="step">
  <div class="step__head"><span class="step__num">1</span><h2 class="step__title" data-i18n="step1.title"></h2></div>
  <p class="step__sub" data-i18n="step1.sub"></p>
  <div class="fields">
    <div class="f">
      <span class="f__label" data-i18n="field.range"></span>
      <div class="pair">
        <input id="near" type="number" min="0.1" step="0.5" data-i18n-aria="a11y.near">
        <span data-i18n="field.rangeTo"></span>
        <input id="far"  type="number" min="0.2" step="0.5" data-i18n-aria="a11y.far">
      </div>
      <p class="f__hint" id="rangeHint"></p>
    </div>
    <div class="f">
      <span class="f__label" data-i18n="field.scenarios"></span>
      <div class="chips" id="scenarios"></div>
      <p class="f__hint" data-i18n="hint.scenarios"></p>
    </div>
  </div>
</section>

<section class="step">
  <div class="step__head"><span class="step__num">2</span><h2 class="step__title" data-i18n="step2.title"></h2></div>
  <p class="step__sub" data-i18n="step2.sub"></p>
  <div class="fields">
    <div class="f">
      <label class="f__label" for="sensor" data-i18n="field.sensor"></label>
      <select id="sensor"></select>
      <p class="f__hint" id="sensorHint"></p>
    </div>
    <div class="f">
      <label class="f__label" for="focal" data-i18n="field.focal"></label>
      <select id="focal"></select>
      <p class="f__hint" id="focalHint"></p>
    </div>
    <div class="f">
      <label class="f__label" for="framing" data-i18n="field.framing"></label>
      <select id="framing"></select>
      <p class="f__hint" id="framingHint"></p>
    </div>
    <div class="f">
      <label class="f__label" for="quality" data-i18n="field.quality"></label>
      <select id="quality"></select>
      <p class="f__hint" id="qualityHint"></p>
    </div>
    <div class="f">
      <label class="f__label" for="iso" data-i18n="field.iso"></label>
      <select id="iso"></select>
      <p class="f__hint" id="isoHint"></p>
    </div>
    <div class="f">
      <label class="f__label" for="compensate" data-i18n="field.compensate"></label>
      <select id="compensate"></select>
      <p class="f__hint" id="compHint"></p>
    </div>
  </div>
</section>

<section class="step">
  <div class="step__head"><span class="step__num">3</span><h2 class="step__title" data-i18n="step3.title"></h2></div>
  <p class="step__sub" data-i18n="step3.sub"></p>

  <div class="ruler" role="img" id="ruler" data-i18n-aria="a11y.ruler">
    <div class="ruler__dof" id="rDof"></div>
    <div class="ruler__target" id="rTarget"></div>
    <div class="ruler__tlabel" id="rLabel"></div>
    <div class="ruler__focus" id="rFocus"></div>
    <div class="ruler__ticks" id="rTicks"></div>
  </div>
  <div class="key">
    <span><i style="background:#22c55e4d;border:1px solid var(--ok-line)"></i><span data-i18n="key.dof"></span></span>
    <span><i style="border:2px dashed var(--brand)"></i><span data-i18n="key.target"></span></span>
    <span><i style="width:3px;background:var(--fg)"></i><span data-i18n="key.focus"></span></span>
  </div>

  <div class="fields" style="margin-top:20px">
    <div class="slide">
      <div class="slide__top"><span class="f__label" data-i18n="field.aperture"></span><span class="slide__val" id="apVal"></span></div>
      <input type="range" id="apRange" min="0" step="1">
      <div class="slide__ends"><span data-i18n="slider.apLow"></span><span data-i18n="slider.apHigh"></span></div>
      <p class="f__hint" id="apHint"></p>
    </div>
    <div class="slide">
      <div class="slide__top"><span class="f__label" data-i18n="field.shutter"></span><span class="slide__val" id="shVal"></span></div>
      <input type="range" id="shRange" min="0" step="1">
      <div class="slide__ends"><span data-i18n="slider.shLow"></span><span data-i18n="slider.shHigh"></span></div>
      <p class="f__hint" id="shHint"></p>
    </div>
    <div class="slide">
      <div class="slide__top"><span class="f__label" data-i18n="field.focusDist"></span><span class="slide__val" id="fdVal"></span></div>
      <input type="range" id="fdRange" min="0.5" step="0.1">
      <div class="slide__ends"><span id="fdMin"></span><span id="fdMax"></span></div>
      <p class="f__hint" id="fdHint"></p>
    </div>
  </div>

  <details>
    <summary data-i18n="details.advanced"></summary>
    <div class="details__body">
      <div class="fields">
        <div class="f">
          <span class="f__label" data-i18n="field.sensorSize"></span>
          <div class="pair">
            <input id="sw" type="number" min="1" step="0.01" data-i18n-aria="a11y.width">
            <span>×</span>
            <input id="sh" type="number" min="1" step="0.01" data-i18n-aria="a11y.height">
          </div>
          <p class="f__hint" data-i18n="hint.autoFill"></p>
        </div>
        <div class="f">
          <label class="f__label" for="mp" data-i18n="field.mp"></label>
          <input id="mp" type="number" min="1" step="1">
          <p class="f__hint" id="mpHint"></p>
        </div>
        <div class="f">
          <label class="f__label" for="coc" data-i18n="field.coc"></label>
          <input id="coc" type="number" min="0.001" step="0.001" readonly>
          <p class="f__hint" id="cocHint"></p>
        </div>
        <div class="f">
          <label class="f__label" for="focalNum" data-i18n="field.customFocal"></label>
          <input id="focalNum" type="number" min="1" step="1">
          <p class="f__hint" data-i18n="hint.customFocal"></p>
        </div>
      </div>
    </div>
  </details>

  <details>
    <summary data-i18n="details.table"></summary>
    <div class="details__body">
      <div class="tscroll">
        <table>
          <thead><tr>
            <th data-i18n="th.aperture"></th><th data-i18n="th.nearest"></th>
            <th data-i18n="th.farthest"></th><th data-i18n="th.dof"></th><th data-i18n="th.enough"></th>
          </tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <p class="mini" data-i18n="note.diffraction"></p>
    </div>
  </details>

  <details>
    <summary data-i18n="details.glossary"></summary>
    <div class="details__body"><dl class="mini" id="glossary"></dl></div>
  </details>
</section>

<p class="foot" data-i18n="foot.privacy"></p>
</div>

<script>

const LOCALES=[
 {id:"zh-Hant",label:"繁體中文"},
 {id:"zh-Hans",label:"简体中文"},
 {id:"en",     label:"English"},
 {id:"ja",     label:"日本語"}
];
const FALLBACK="en";

const I18n={
 locale:"zh-Hant",
 has:id=>Object.prototype.hasOwnProperty.call(MESSAGES,id),
 detect(){
  const q=new URLSearchParams(location.hash.slice(1)).get("lang");
  if(q&&I18n.has(q))return q;
  try{const st=localStorage.getItem("dof.lang");if(st&&I18n.has(st))return st}catch{}
  for(const nav of navigator.languages??[navigator.language]){
   if(!nav)continue;
   if(I18n.has(nav))return nav;
   const low=nav.toLowerCase();
   if(low.startsWith("zh"))return /hans|cn|sg/.test(low)?"zh-Hans":"zh-Hant";
   const base=low.split("-")[0];
   const hit=LOCALES.find(l=>l.id.toLowerCase().split("-")[0]===base);
   if(hit)return hit.id;
  }
  return "zh-Hant";
 },
 set(id){
  I18n.locale=I18n.has(id)?id:FALLBACK;
  try{localStorage.setItem("dof.lang",I18n.locale)}catch{}
  document.documentElement.lang=I18n.locale;
 },
 t(key,vars){
  const dict=MESSAGES[I18n.locale]??MESSAGES[FALLBACK];
  let s=dict[key]??MESSAGES[FALLBACK][key]??key;
  if(vars)for(const[k,v]of Object.entries(vars))s=s.replaceAll(`{${k}}`,v);
  return s;
 },
 paint(root=document){
  root.querySelectorAll("[data-i18n]").forEach(n=>n.textContent=I18n.t(n.dataset.i18n));
  root.querySelectorAll("[data-i18n-aria]").forEach(n=>n.setAttribute("aria-label",I18n.t(n.dataset.i18nAria)));
  document.title=I18n.t("meta.title");
  const m=document.getElementById("metaDesc");
  if(m)m.content=I18n.t("meta.desc");
 }
};
const t=I18n.t;

/* ═════════════════════════════════════════════════
   2. Domain data
   ═════════════════════════════════════════════════ */
const SENSORS=[
 {id:"mf",w:44,h:33,coc:.053},{id:"ff",w:36,h:24,coc:.030},
 {id:"apsh",w:28.7,h:19,coc:.023},{id:"apsc",w:23.6,h:15.7,coc:.020},
 {id:"apscC",w:22.3,h:14.9,coc:.019},{id:"m43",w:17.3,h:13,coc:.015},
 {id:"one",w:13.2,h:8.8,coc:.011},{id:"i17",w:7.6,h:5.7,coc:.006},
 {id:"i23",w:6.17,h:4.55,coc:.005},{id:"i28",w:5.6,h:4.2,coc:.0047},
 {id:"i30",w:4.8,h:3.6,coc:.0040}
];
const FOCALS=[4,6,8,12,14,16,20,24,28,35,50,85,105,135,200,300];
const STOPS=[1.0,1.2,1.4,1.8,2.0,2.8,4,5.6,8,11,16,22,32];
const ISOS=[50,100,200,400,800,1600,3200,6400,12800,25600,51200];
const SHUTTERS=[30,15,8,4,2,1,1/2,1/4,1/8,1/15,1/30,1/60,1/125,1/250,
                1/500,1/1000,1/2000,1/4000,1/8000];
const QUALITY=[
 {id:"screen",mult:2.0},{id:"normal",mult:1.0},
 {id:"print",mult:0.6},{id:"pixel",mult:null}
];
const FRAMINGS=["focal","fov"];
const COMPS=["iso","shutter","off"];
const SCENARIOS=[
 {id:"group",near:3,far:6},{id:"street",near:5,far:12},{id:"event",near:8,far:13},
 {id:"landscape",near:10,far:200},{id:"cctv",near:4,far:20}
];
const GLOSSARY=["focus","stop","coc","hyper","diff","exposure"];
const LAMBDA=.00055, FF_DIAG=Math.hypot(36,24), FT=3.280839895;

const DEF=Object.freeze({sensor:"ff",sw:36,sh:24,mp:24,focal:35,focalIdeal:null,
 quality:"normal",framing:"focal",stop:2.8,focus:9.9,near:8,far:13,unit:"m",
 iso:400,shutter:1/125,compensate:"iso",drift:0});

/* ═════════════════════════════════════════════════
   3. Optics — pure
   ═════════════════════════════════════════════════ */
const O={
 pitch:(w,h,mp)=>{const a=w/h;return w/(Math.sqrt(mp*1e6/a)*a)},
 hyper:(f,N,c)=>f*f/(N*c)+f,
 limits(f,N,c,s){const H=O.hyper(f,N,c);
  return{H,near:H*s/(H+s-f),far:H>s-f?H*s/(H-s+f):Infinity}},
 optFocus:(f,n,d)=>(2*n*d-f*(n+d))/(n+d-2*f),
 reqStop(f,c,n,d){const s=O.optFocus(f,n,d);return f*f/(c*(n*(s-f)/(s-n)-f))},
 diffract:c=>c/(2.44*LAMBDA),
 crop:(w,h)=>FF_DIAG/Math.hypot(w,h),
 covers:(l,n,d)=>l.near<=n&&l.far>=d
};
const nearestFocal=v=>FOCALS.reduce((a,b)=>Math.abs(b-v)<Math.abs(a-v)?b:a);

/* ── Exposure: keep N²/(T·ISO) constant ── */
const Exp={
 stops:(a,b)=>2*Math.log2(b/a),
 snap:(arr,v)=>arr.reduce((x,y)=>Math.abs(Math.log2(y/v))<Math.abs(Math.log2(x/v))?y:x),
 handheld:(focal,crop)=>1/(focal*crop),
 label(sec){
  if(sec>=1)return `${Number.isInteger(sec)?sec:sec.toFixed(1)}s`;
  return `1/${Math.round(1/sec)}`;
 },
 compensate(need,iso,shutter,mode){
  if(mode==="off"||Math.abs(need)<1e-9)return{iso,shutter,drift:need};
  const gain=(cur,arr,want)=>{
   const lo=Math.min(arr[0],arr.at(-1)), hi=Math.max(arr[0],arr.at(-1));
   const hit=Exp.snap(arr,Math.min(Math.max(cur*Math.pow(2,want),lo),hi));
   return{val:hit,used:Math.log2(hit/cur)};
  };
  let nIso=iso,nSh=shutter,left=need;
  if(mode==="iso"){
   const a=gain(nIso,ISOS,left); nIso=a.val; left-=a.used;
   if(Math.abs(left)>0.05){const b=gain(nSh,SHUTTERS,left);nSh=b.val;left-=b.used;}
  }else{
   const a=gain(nSh,SHUTTERS,left); nSh=a.val; left-=a.used;
   if(Math.abs(left)>0.05){const b=gain(nIso,ISOS,left);nIso=b.val;left-=b.used;}
  }
  return{iso:nIso,shutter:nSh,drift:left};
 }
};

/* ═════════════════════════════════════════════════
   4. Units + formatting
   ═════════════════════════════════════════════════ */
const U={
 factor:()=>S.d.unit==="ft"?FT:1,
 suffix:()=>t(S.d.unit==="ft"?"unit.ft":"unit.m"),
 dec:()=>S.d.unit==="ft"?0:1,
 n(v,d){return new Intl.NumberFormat(I18n.locale,
   {minimumFractionDigits:d,maximumFractionDigits:d}).format(v)},
 raw(mm,d=U.dec()){return Number.isFinite(mm)?U.n(mm/1000*U.factor(),d):"∞"},
 disp(mm,d=U.dec()){return Number.isFinite(mm)
   ?`${U.n(mm/1000*U.factor(),d)} ${U.suffix()}`:t("unit.infinity")},
 out:m=>+(m*U.factor()).toFixed(U.dec()===0?1:2),
 in:v=>v/U.factor()
};
const F={
 stop:v=>Number.isFinite(v)?`f/${U.n(v,1)}`:"—",
 snap:v=>STOPS.find(n=>n>=v)??STOPS.at(-1)
};

/* ═════════════════════════════════════════════════
   5. State
   ═════════════════════════════════════════════════ */
const S={d:{...DEF},subs:new Set(),
 on(fn){this.subs.add(fn)},
 set(p){Object.assign(this.d,p);this.subs.forEach(fn=>fn(this.d))},
 reset(){this.set({...DEF,unit:this.d.unit})}};

/* ═════════════════════════════════════════════════
   6. DOM helpers
   ═════════════════════════════════════════════════ */
const $=i=>document.getElementById(i);
const opts=(node,items,value)=>{
 node.replaceChildren(...items.map(o=>new Option(o.label,o.value)));
 if(value!==undefined)node.value=value;
};
const ok=(v,min,fb)=>Number.isFinite(v)&&v>=min?v:fb;

/* ═════════════════════════════════════════════════
   7. Derive — state → view model
   ═════════════════════════════════════════════════ */
function derive(d){
 const s=d.focus*1e3, tn=d.near*1e3, tf=d.far*1e3;
 const pitch=O.pitch(d.sw,d.sh,d.mp);
 const base=(SENSORS.find(x=>x.id===d.sensor)??SENSORS[1]).coc;
 const q=QUALITY.find(x=>x.id===d.quality)??QUALITY[1];
 const coc=q.mult===null?pitch*2:base*q.mult;
 const lim=O.limits(d.focal,d.stop,coc,s);
 const reqN=O.reqStop(d.focal,coc,tn,tf);
 const hh=Exp.handheld(d.focal,O.crop(d.sw,d.sh));
 return{pitch,coc,lim,s,tn,tf,reqN,
  optF:O.optFocus(d.focal,tn,tf),
  snap:F.snap(reqN),
  diffN:O.diffract(coc),
  equiv:d.focal*O.crop(d.sw,d.sh),
  handheld:hh,
  tooSlow:d.shutter>hh*1.05,
  covered:O.covers(lim,tn,tf),
  diffracted:d.stop>O.diffract(coc),
  valid:tf>tn,
  feasible:Number.isFinite(reqN)&&reqN>0&&reqN<=STOPS.at(-1)};
}

/* ═════════════════════════════════════════════════
   8. View
   ═════════════════════════════════════════════════ */
const V={
 localise(d){
  I18n.paint();
  opts($("lang"),LOCALES.map(l=>({value:l.id,label:l.label})),I18n.locale);
  opts($("unit"),[{value:"m",label:t("unit.optM")},{value:"ft",label:t("unit.optFt")}],d.unit);
  opts($("sensor"),SENSORS.map(s=>({value:s.id,label:t(`sensor.${s.id}`)})),d.sensor);
  opts($("focal"),FOCALS.map(f=>({value:f,label:`${f} mm`})));
  opts($("quality"),QUALITY.map(q=>({value:q.id,label:t(`quality.${q.id}`)})),d.quality);
  opts($("framing"),FRAMINGS.map(f=>({value:f,label:t(`framing.${f}`)})),d.framing);
  opts($("iso"),ISOS.map(v=>({value:v,label:`ISO ${v}`})),d.iso);
  opts($("compensate"),COMPS.map(c=>({value:c,label:t(`comp.${c}`)})),d.compensate);
  $("rLabel").textContent=t("ruler.target");
  $("apRange").max=STOPS.length-1;
  $("shRange").max=SHUTTERS.length-1;
  V.scenarios(d);
  V.glossary();
 },

 scenarios(d){
  $("scenarios").replaceChildren(...SCENARIOS.map(sc=>{
   const b=document.createElement("button");
   b.className="chip";b.type="button";
   const lo=U.n(sc.near*U.factor(),0);
   const hi=sc.far>=200?"∞":U.n(sc.far*U.factor(),0);
   b.textContent=`${t(`scenario.${sc.id}`)} ${lo}–${hi} ${U.suffix()}`;
   b.dataset.near=sc.near;b.dataset.far=sc.far;
   b.onclick=()=>S.set({near:sc.near,far:sc.far});
   return b;}));
 },

 glossary(){
  $("glossary").replaceChildren(...GLOSSARY.flatMap(k=>{
   const dt=document.createElement("dt");dt.textContent=t(`gloss.${k}`);
   const dd=document.createElement("dd");dd.textContent=t(`gloss.${k}.body`);
   return[dt,dd];}));
 },

 sync(d,v){
  const stepDist=d.unit==="ft"?1:0.5;
  $("near").value=U.out(d.near); $("near").step=stepDist;
  $("far").value=U.out(d.far);   $("far").step=stepDist;
  $("sensor").value=d.sensor;
  $("focal").value=FOCALS.includes(d.focal)?d.focal:"";
  $("quality").value=d.quality; $("framing").value=d.framing;
  $("iso").value=d.iso; $("compensate").value=d.compensate;
  $("sw").value=d.sw; $("sh").value=d.sh; $("mp").value=d.mp;
  $("focalNum").value=d.focal; $("coc").value=v.coc.toFixed(4);

  $("apRange").value=Math.max(0,STOPS.indexOf(F.snap(d.stop)));
  $("apVal").textContent=`f/${U.n(d.stop,1)}`;
  $("shRange").value=Math.max(0,SHUTTERS.indexOf(Exp.snap(SHUTTERS,d.shutter)));
  $("shVal").textContent=Exp.label(d.shutter);

  const topM=Math.max(60,Math.ceil(d.far*1.5));
  const r=$("fdRange");
  r.min=U.out(0.5); r.max=U.out(topM); r.step=d.unit==="ft"?0.5:0.1;
  r.value=Math.min(U.out(d.focus),U.out(topM));
  $("fdMin").textContent=U.disp(500,U.dec());
  $("fdMax").textContent=U.disp(topM*1000,0);
  $("fdVal").textContent=U.disp(d.focus*1000);

  [...$("scenarios").children].forEach(b=>
   b.setAttribute("aria-pressed",String(+b.dataset.near===d.near&&+b.dataset.far===d.far)));
 },

 verdict(d,v){
  const box=$("verdict"), near=U.disp(v.tn), far=U.disp(v.tf);
  if(!v.valid){
   box.dataset.ok="false"; $("vIcon").textContent="!";
   $("vFlag").textContent=t("verdict.badFlag");
   $("vMsg").textContent=t("verdict.badMsg");
   $("aFocus").textContent="—"; $("aStop").textContent="—"; $("aExp").textContent="—";
   $("aFocusNote").textContent=""; $("aStopNote").textContent=""; $("aExpNote").textContent="";
   $("btnApply").disabled=true; return;
  }
  $("btnApply").disabled=false;
  $("aFocus").textContent=U.disp(v.optF);
  $("aFocusNote").textContent=t("answer.hyper",{v:U.disp(v.lim.H)});
  $("aStop").textContent=v.feasible?`f/${U.n(v.snap,1)}`:t("answer.impossible");
  $("aStopNote").textContent=v.feasible
   ? t(v.snap>v.diffN?"answer.theoryDiff":"answer.theory",{v:F.stop(v.reqN)})
   : t("answer.impossibleNote");

  $("aExp").textContent=`f/${U.n(d.stop,1)} · ${Exp.label(d.shutter)} · ISO ${d.iso}`;
  const drift=Math.abs(d.drift)>0.05;
  $("aExpNote").textContent=drift
   ? t("answer.expClipped",{v:U.n(Math.abs(d.drift),1)}) : t("answer.expNote");
  $("aExpNote").className="answer__note"+(drift?" exp-warn":"");

  box.dataset.ok=String(v.covered);
  $("vIcon").textContent=v.covered?"✓":"✗";
  $("vFlag").textContent=t(v.covered?"verdict.okFlag":"verdict.noFlag");
  $("vMsg").textContent=v.covered
   ? t("verdict.okMsg",{near,far})+t(v.diffracted?"verdict.okDiff":"verdict.okSafe")
   : (v.feasible?t("verdict.noFeasible",{near,far}):t("verdict.noImpossible"));
 },

 ruler(v){
  const cap=Math.max(v.tf*1.35,Number.isFinite(v.lim.far)?v.lim.far*1.08:v.tf*1.9,v.s*1.3);
  const p=x=>Math.max(0,Math.min(100,x/cap*100));
  const end=p(Number.isFinite(v.lim.far)?v.lim.far:cap);
  Object.assign($("rDof").style,{left:p(v.lim.near)+"%",width:(end-p(v.lim.near))+"%"});
  Object.assign($("rTarget").style,{left:p(v.tn)+"%",width:(p(v.tf)-p(v.tn))+"%"});
  $("rLabel").style.left=((p(v.tn)+p(v.tf))/2)+"%";
  $("rFocus").style.left=p(v.s)+"%";
  $("rTicks").replaceChildren(...[0,.25,.5,.75,1].map(r=>{
   const n=document.createElement("span");
   n.textContent=U.raw(cap*r,0)+U.suffix();return n;}));
 },

 hints(d,v){
  const sn=SENSORS.find(s=>s.id===d.sensor);
  $("sensorHint").textContent=sn
   ? t("hint.crop",{v:U.n(O.crop(d.sw,d.sh),1)}) : t("hint.customSize");
  const ideal=d.focalIdeal;
  $("focalHint").textContent=(ideal&&Math.abs(ideal-d.focal)>0.6)
   ? t("hint.equivSnap",{e:U.n(v.equiv,0),i:ideal,c:d.focal})
   : t("hint.equiv",{e:U.n(v.equiv,0)});
  $("framingHint").textContent=t(d.framing==="fov"?"hint.framingFov":"hint.framingFocal");
  $("framingHint").className="f__hint"+(d.framing==="focal"&&v.equiv>50?" f__hint--warn":"");
  $("qualityHint").textContent=t(`quality.${d.quality}.hint`);
  $("isoHint").textContent=t("hint.iso");
  $("compHint").textContent=t(d.compensate==="iso"?"hint.compIso"
    :d.compensate==="shutter"?"hint.compShutter":"hint.compOff");

  $("apHint").textContent=v.diffracted
   ? t("hint.diffOver",{v:F.stop(v.diffN)}) : t("hint.diffLimit",{v:F.stop(v.diffN)});
  $("apHint").className="f__hint"+(v.diffracted?" f__hint--warn":"");

  const hh=Exp.label(Exp.snap(SHUTTERS,v.handheld));
  $("shHint").textContent=t(v.tooSlow?"hint.shutterSlow":"hint.shutterOk",
    {v:Exp.label(d.shutter),s:hh});
  $("shHint").className="f__hint"+(v.tooSlow?" f__hint--warn":"");

  $("fdHint").textContent=v.covered?t("hint.focusOk"):t("hint.focusMove",{v:U.disp(v.optF)});
  $("rangeHint").textContent=v.valid
   ? t("hint.needDof",{v:U.disp(v.tf-v.tn)}) : t("hint.badRange");
  $("rangeHint").className="f__hint"+(v.valid?"":" f__hint--warn");
  $("far").setAttribute("aria-invalid",String(!v.valid));
  $("mpHint").textContent=t("hint.pitch",{v:U.n(v.pitch*1000,2)});
  $("cocHint").textContent=t(d.quality==="pixel"?"hint.cocPixel":"hint.cocAuto");
 },

 table(d,v){
  $("tbody").replaceChildren(...STOPS.map(N=>{
   const l=O.limits(d.focal,N,v.coc,v.s);
   const good=O.covers(l,v.tn,v.tf), df=N>v.diffN;
   const tr=document.createElement("tr");
   tr.dataset.now=String(N===F.snap(d.stop));
   tr.innerHTML=`<td>f/${U.n(N,1)}</td><td>${U.raw(l.near)}</td><td>${U.raw(l.far)}</td>`+
    `<td>${Number.isFinite(l.far)?U.raw(l.far-l.near):"∞"}</td>`+
    `<td class="${good?"good":"bad"}">${good?"✓":"✗"}${df?" △":""}</td>`;
   return tr;}));
 },

 render(d){
  const v=derive(d);
  V.sync(d,v); V.hints(d,v); V.verdict(d,v); V.ruler(v); V.table(d,v);
  V.last=v;
 }
};

/* ═════════════════════════════════════════════════
   9. Persistence — URL hash (share) + localStorage (recall)
   ═════════════════════════════════════════════════ */
/** Coerce an untrusted record against DEF's shape. */
function sanitise(src){
 const o={};
 for(const[k,dv]of Object.entries(DEF)){
  const val=src?.[k];
  if(val===undefined||val===null)continue;
  if(typeof dv==="number"){
   const n=typeof val==="number"?val:parseFloat(val);
   if(Number.isFinite(n)&&n>0)o[k]=n;
  }else if(typeof dv==="string"){
   if(typeof val==="string"&&val)o[k]=val;
  }
 }
 return Object.keys(o).length?o:null;
}

const Url={
 read(){
  const q=new URLSearchParams(location.hash.slice(1));
  if(![...q].length)return null;
  return sanitise(Object.fromEntries(q));
 },
 write(d){
  history.replaceState(null,"","#"+new URLSearchParams({...d,lang:I18n.locale}));
 }
};

const Store={
 KEY:"dof.state",
 VER:2,                       // bump when DEF's shape changes; stale caches expire
 read(){
  try{
   const raw=JSON.parse(localStorage.getItem(Store.KEY)||"null");
   return raw&&raw.v===Store.VER?sanitise(raw.d):null;
  }catch{return null}
 },
 write(d){
  try{localStorage.setItem(Store.KEY,JSON.stringify({v:Store.VER,d}))}catch{}
 },
 clear(){try{localStorage.removeItem(Store.KEY)}catch{}}
};

/* ═════════════════════════════════════════════════
   10. Controller
   ═════════════════════════════════════════════════ */
for(const id of["near","far"])
 $(id).addEventListener("input",e=>{
  const v=parseFloat(e.target.value);
  if(Number.isFinite(v))S.set({[id]:U.in(v)});
 });

for(const[id,min]of Object.entries({sw:1,sh:1,mp:1,focalNum:1}))
 $(id).addEventListener("input",e=>{
  const key=id==="focalNum"?"focal":id;
  const patch={[key]:ok(parseFloat(e.target.value),min,S.d[key])};
  if(key==="focal")patch.focalIdeal=null;
  S.set(patch);
 });

$("sensor").onchange=e=>{
 const s=SENSORS.find(x=>x.id===e.target.value), d=S.d;
 const p={sensor:s.id,sw:s.w,sh:s.h,focalIdeal:null};
 if(d.framing==="fov"){
  const ideal=d.focal*O.crop(d.sw,d.sh)/O.crop(s.w,s.h);
  p.focal=nearestFocal(ideal);
  p.focalIdeal=+ideal.toFixed(1);
 }
 S.set(p);
};
$("focal").onchange   = e=>S.set({focal:+e.target.value,focalIdeal:null});
$("quality").onchange = e=>S.set({quality:e.target.value});
$("framing").onchange = e=>S.set({framing:e.target.value});

/** Aperture is the only control that rebalances the exposure triangle. */
$("apRange").oninput=e=>{
 const next=STOPS[+e.target.value], d=S.d;
 const r=Exp.compensate(Exp.stops(d.stop,next),d.iso,d.shutter,d.compensate);
 S.set({stop:next,iso:r.iso,shutter:r.shutter,drift:r.drift});
};
$("iso").onchange        = e=>S.set({iso:+e.target.value,drift:0});
$("shRange").oninput     = e=>S.set({shutter:SHUTTERS[+e.target.value],drift:0});
$("compensate").onchange = e=>S.set({compensate:e.target.value,drift:0});
$("fdRange").oninput     = e=>S.set({focus:U.in(+e.target.value)});

$("unit").onchange=e=>{S.set({unit:e.target.value});V.localise(S.d);V.render(S.d)};
$("lang").onchange=e=>{I18n.set(e.target.value);V.localise(S.d);V.render(S.d)};

$("btnApply").onclick=()=>{
 const d=S.d, next=V.last.feasible?V.last.snap:STOPS.at(-1);
 const r=Exp.compensate(Exp.stops(d.stop,next),d.iso,d.shutter,d.compensate);
 S.set({focus:+(V.last.optF/1000).toFixed(2),stop:next,
        iso:r.iso,shutter:r.shutter,drift:r.drift});
};
$("btnReset").onclick=()=>{Store.clear();S.reset()};
$("btnLink").onclick=async e=>{
 Url.write(S.d);
 const done=t("btn.linkDone"), fail=t("btn.linkFail"), orig=t("btn.link");
 try{await navigator.clipboard.writeText(location.href);e.target.textContent=done}
 catch{e.target.textContent=fail}
 setTimeout(()=>{e.target.textContent=orig},1600);
};

/* ═════════════════════════════════════════════════
   11. Bootstrap — URL beats storage beats defaults
   ═════════════════════════════════════════════════ */
I18n.set(I18n.detect());
const restored=Url.read()??Store.read();
if(restored)Object.assign(S.d,restored);
else if(/^en/i.test(I18n.locale)&&/US|LR|MM/i.test(navigator.language||""))S.d.unit="ft";

V.localise(S.d);
S.on(V.render);

let saveJob=0;
S.on(d=>{clearTimeout(saveJob);saveJob=setTimeout(()=>Store.write(d),400)});

S.set({});
})();
</script>
