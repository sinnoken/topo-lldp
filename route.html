<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Analyzer | Google Design</title>
    <link href="css/output.css" rel="stylesheet">
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto+Mono&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0" />

    <style>
        :root {
            --google-blue: #1a73e8;
            --google-gray: #5f6368;
            --google-border: #dadce0;
            /* 將 JS 中的顏色定義移至 CSS 變數 */
            --color-hq: #1a73e8;
            --color-dr: #f9ab00;
            --color-branch: #1e8e3e;
            --color-transit: #9333ea;
            --color-tko: #db2777;
            --color-internet: #5f6368;
        }

        body {
            font-family: 'Google Sans', sans-serif;
            background-color: #ffffff;
            color: #3c4043;
        }

        #network-wrapper {
            position: relative;
            flex: 1;
            min-width: 0;
            height: 100%;
        }

        #mynetwork {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            outline: none;
        }

        .md-card {
            background: #fff;
            border-radius: 8px;
            border: 1px solid var(--google-border);
            transition: box-shadow 0.3s;
        }

        .jetbrains {
            font-family: 'Roboto Mono', monospace;
        }

        .status-badge {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 500;
        }
    </style>
</head>

<body class="h-screen flex flex-col overflow-hidden">
    <nav class="h-14 border-b border-gray-200 px-4 flex items-center justify-between bg-white z-20">
        <div class="flex items-center gap-2">
            <div class="p-1.5 bg-blue-50 rounded-lg text-blue-600">
                <span class="material-symbols-outlined text-2xl">account_tree</span>
            </div>
            <span class="text-lg font-medium tracking-tight text-gray-700">Network Topology <span
                    class="text-gray-400 font-normal">| Analyzer</span></span>
        </div>

        <div class="flex items-center gap-4 bg-gray-50 border border-gray-200 rounded-lg px-3 py-1">
            <div class="flex items-center gap-2">
                <span class="text-[10px] font-bold text-gray-400">SRC</span>
                <input type="text" id="srcIP" value="10.0.1.100"
                    class="bg-transparent border-none text-sm w-32 focus:ring-0 jetbrains">
            </div>
            <span class="text-gray-300">|</span>
            <div class="flex items-center gap-2">
                <span class="text-[10px] font-bold text-gray-400">DST</span>
                <input type="text" id="dstIP" value="8.8.8.8"
                    class="bg-transparent border-none text-sm w-32 focus:ring-0 jetbrains">
            </div>
            <button onclick="analyzer.tracePath()"
                class="bg-[#1a73e8] hover:bg-[#1557b0] text-white px-4 py-1.5 rounded text-sm font-medium transition-colors shadow-sm">
                Run Analysis
            </button>
        </div>
        <div class="w-24"></div>
    </nav>

    <main class="flex flex-1 overflow-hidden">
        <section id="network-wrapper" class="bg-gray-50">
            <div id="mynetwork"></div>
        </section>

        <aside class="w-[380px] border-l border-gray-200 flex flex-col bg-white overflow-hidden">
            <div class="p-4 border-b border-gray-100 flex items-center justify-between">
                <h3 class="font-medium text-sm flex items-center gap-2">
                    <span class="material-symbols-outlined text-gray-400">insights</span> Routing Decisions
                </h3>
            </div>
            <div id="log-container" class="flex-1 overflow-y-auto p-4 space-y-4">
                <div class="flex flex-col items-center justify-center h-full text-gray-300">
                    <span class="material-symbols-outlined text-5xl mb-2">radar</span>
                    <p class="text-xs uppercase tracking-tighter">Enter IP to Start Trace</p>
                </div>
            </div>
        </aside>
    </main>

    <script src="js/route.js"></script>
    <script>
        // 將原先在 JS 裡的資料陣列移到這裡
        const NETWORK_CONFIG = {
            nodes: [
                { id: 'H1', label: 'HQ Host\n192.168.1.10', group: 'HQ', type: 'host', ip: '192.168.1.10', mask: 24, gateway: '192.168.1.1' },
                { id: 'R1', label: 'HQ Core', group: 'HQ', type: 'router', interfaces: [{ name: 'Gig0/0', ip: '192.168.1.1', mask: 24 }, { name: 'Gig0/1', ip: '10.0.1.1', mask: 24 }, { name: 'Gig0/2', ip: '172.16.254.1', mask: 30 }, { name: 'Gig0/3', ip: '10.255.1.1', mask: 30 }], routingTable: [{ network: '10.0.1.0', mask: 24, nextHop: '10.0.1.2' }, { network: '172.16.1.0', mask: 24, nextHop: '172.16.254.2' }, { network: '10.20.1.0', mask: 24, nextHop: '10.255.1.2' }, { network: '0.0.0.0', mask: 0, nextHop: '172.16.254.2' }] },
                { id: 'R2', label: 'DR Edge', group: 'DR', type: 'router', interfaces: [{ name: 'Gig0/0', ip: '172.16.1.1', mask: 24 }, { name: 'Gig0/1', ip: '172.16.254.2', mask: 30 }, { name: 'Ser0/0', ip: '8.8.8.7', mask: 30 }], routingTable: [{ network: '192.168.1.0', mask: 24, nextHop: '172.16.254.1' }, { network: '8.8.8.8', mask: 32, nextHop: '8.8.8.8' }] },
                { id: 'H2', label: 'DR Server\n172.16.1.50', group: 'DR', type: 'host', ip: '172.16.1.50', mask: 24, gateway: '172.16.1.1' },
                { id: 'R3', label: 'Branch Router', group: 'Branch', type: 'router', interfaces: [{ name: 'Gig0/0', ip: '10.0.1.2', mask: 24 }, { name: 'Gig0/1', ip: '10.0.2.1', mask: 24 }], routingTable: [{ network: '0.0.0.0', mask: 0, nextHop: '10.0.1.1' }] },
                { id: 'H3', label: 'Branch Host\n10.0.1.100', group: 'Branch', type: 'host', ip: '10.0.1.100', mask: 24, gateway: '10.0.2.1' },
                { id: 'R4', label: 'Transit Router', group: 'Transit', type: 'router', interfaces: [{ name: 'Gig0/0', ip: '10.255.1.2', mask: 30 }, { name: 'Gig0/1', ip: '10.255.2.1', mask: 30 }], routingTable: [{ network: '10.20.1.0', mask: 24, nextHop: '10.255.2.2' }, { network: '0.0.0.0', mask: 0, nextHop: '10.255.1.1' }] },
                { id: 'R5', label: 'TKO Edge', group: 'TKO', type: 'router', interfaces: [{ name: 'Gig0/0', ip: '10.20.1.1', mask: 24 }, { name: 'Gig0/1', ip: '10.255.2.2', mask: 30 }], routingTable: [{ network: '0.0.0.0', mask: 0, nextHop: '10.255.2.1' }] },
                { id: 'H4', label: 'TKO DB Server\n10.20.1.200', group: 'TKO', type: 'host', ip: '10.20.1.200', mask: 24, gateway: '10.20.1.1' },
                { id: 'Cloud', label: 'Public DNS\n8.8.8.8', group: 'Internet', type: 'host', ip: '8.8.8.8', mask: 32, gateway: '8.8.8.7' }
            ],
            edges: [
                { id: 'e1', from: 'H1', to: 'R1', label: 'Gig0/0' },
                { id: 'e2', from: 'R1', to: 'R2', label: 'Gig0/2' },
                { id: 'e7', from: 'R1', to: 'R4', label: 'Gig0/3' },
                { id: 'e4', from: 'R3', to: 'R1', label: 'VPN', dashes: true },
                { id: 'e3', from: 'R2', to: 'H2', label: 'Gig0/0' },
                { id: 'e6', from: 'R2', to: 'Cloud', label: 'Ser0/0' },
                { id: 'e8', from: 'R2', to: 'R4', label: 'Backup' },
                { id: 'e5', from: 'R3', to: 'H3', label: 'Gig0/1' },
                { id: 'e9', from: 'R4', to: 'R5', label: 'Global' },
                { id: 'e10', from: 'R5', to: 'H4', label: 'Gig0/0' }
            ],
            colors: {
                'HQ': '#1a73e8', 'DR': '#f9ab00', 'Branch': '#1e8e3e',
                'Transit': '#9333ea', 'TKO': '#db2777', 'Internet': '#5f6368'
            }
        };

        // 初始化分析器
        const analyzer = new NetworkAnalyzer('mynetwork', NETWORK_CONFIG);
        window.onload = () => analyzer.init();
    </script>
</body>

</html>
